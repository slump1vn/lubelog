name: Mobile app (Flutter)

on:
  push:
    paths:
      - "mobile/**"
      - "wwwroot/api/openapi-v1.json"
      - ".github/workflows/mobile.yml"
  # Catch a stale API client before merge, not after (it broke main once).
  pull_request:
    paths:
      - "mobile/**"
      - "wwwroot/api/openapi-v1.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      # Fails when wwwroot/api/openapi-v1.json changed but lib/api/generated was not regenerated.
      - name: API client matches the server contract
        run: dart run swagger_parser --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Same release key as the old TWA app (docs/ANDROID.md). Without it the APK is debug-signed.
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/debug-info

      - name: Name the APK
        run: |
          mkdir -p out
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "out/soi-tho-flutter-${{ github.run_number }}.apk"
          echo "### APK: soi-tho-flutter-${{ github.run_number }}.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: soi-tho-flutter-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # Needed to read crash stack traces from the obfuscated build.
      - uses: actions/upload-artifact@v5
        with:
          name: debug-info-${{ github.run_number }}
          path: mobile/build/debug-info
          retention-days: 90
