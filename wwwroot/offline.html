<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Mất kết nối - Sói &amp; Thỏ</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.25rem; margin: 1.25rem 0 .5rem; }
    p { line-height: 1.5; color: #94a3b8; margin: 0 0 1.5rem; }
    button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; min-height: 48px; border: 0; border-radius: 999px;
             background: #0f766e; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/defaults/app_icon_192.png" alt="">
    <h1>Chưa kết nối được máy chủ</h1>
    <p>Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại. Số liệu của gia đình không lưu trên điện thoại nên cần có mạng để xem.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
